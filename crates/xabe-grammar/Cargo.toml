[package]
name = "xabe-grammar"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `preserve_order` so parameters keep the order the prompt rendered them in;
# the workspace unifies the feature anyway, and declaring it keeps this crate
# behaving the same when it is built alone.
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
