name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The release profile carries `debug = 1` so local profiling has symbols.
  # CI never opens a profiler and pays for them in disk and cache size, so
  # drop them. Optimization settings are untouched: this is the same build,
  # without the symbols.
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # The whole workspace must stay buildable and testable without a GPU or the
  # CUDA toolkit. That is a design property worth enforcing, not just a
  # convenience: the correctness work that matters most (kernel references,
  # cache geometry, scheduler invariants) must never be gated on device
  # access, and every test that does need a device skips and says so.
  #
  # No CUDA toolkit is installed because none is needed. `xabe-cuda` has no
  # build script, and cudarc is built with `fallback-dynamic-loading` and
  # `nvrtc`, so it resolves the driver at runtime and compiles kernels at
  # runtime. Nothing wants a header or nvcc at build time.
  workspace:
    name: workspace (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every component rust-toolchain.toml pins, so the action picks a
      # nightly that actually has all of them — nightlies routinely ship
      # without one, and cargo would then fail on the pin rather than here.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release, matching AGENTS.md: a debug-build test run is not a signal.
      #
      # Tests that need a device, the 32 GB model file, or a golden capture
      # skip themselves and print why. A skip is not a pass (CONTRIBUTING.md),
      # so a green run here means the host-side contracts hold — not that the
      # kernels were verified.
      - name: Tests
        run: cargo test --workspace --release

      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The design plan is a local draft and must never enter the tree; likewise
  # model weights, which are 32 GB.
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No design plan committed
        run: |
          if git ls-files --error-unmatch qwen36-rust-engine-plan.md 2>/dev/null; then
            echo "::error::qwen36-rust-engine-plan.md is tracked; it is a local draft (see AGENTS.md)"
            exit 1
          fi
          echo "ok: design plan is not tracked"

      - name: No model weights or goldens committed
        run: |
          offenders=$(git ls-files | grep -E '\.(gguf|safetensors)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::model weights are tracked:"
            echo "$offenders"
            exit 1
          fi
          echo "ok: no weights tracked"
